<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>Trending Rental | Premium Cars</title>
  
  <link rel="icon" type="image/png" href="TrendingPro.png">
  <link rel="apple-touch-icon" href="TrendingPro.png">

  <style>
    /* إزالة أي هوامش أو أشرطة تمرير */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f5f7; 
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* تصميم شاشة التحميل الاحترافية */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f5f5f7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease; /* تأثير اختفاء ناعم */
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #4f46e5; /* لون متناسق مع النظام */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 16px;
      color: #64748b;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* إعدادات الـ iframe */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">جاري الاتصال بالنظام...</div>
  </div>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbzIrLr6ktOVIiiHJanFEsj1rdriXcGUKtmWxHfmOOjEAeGQIPiR7pa8fOb-s5Wb67y0sA/exec?page=admin"
    onload="hideLoader()">
  </iframe>

  <script>
    // دالة إخفاء شاشة التحميل
    function hideLoader() {
      const loader = document.getElementById('loader');
      // جعل الشفافية صفر تدريجياً
      loader.style.opacity = '0';
      // إزالة العنصر تماماً بعد نصف ثانية حتى لا يعيق الضغط على النظام
      setTimeout(() => { 
        loader.style.display = 'none'; 
      }, 600);
    }
  </script>
</body>
</html>
