<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Trending Rental | Premium Cars</title>
  <link rel="icon" type="image/png" href="trendinglogo (2).png">
  <link rel="apple-touch-icon" href="TrendingPro.png">
  <meta property="og:title" content="Trending Rental | Premium Cars">
  <meta property="og:description" content="احجز سيارتك الفاخرة الآن - نظام إدارة الحجوزات">
  <meta property="og:image" content="ضع_رابط_الصورة_الكبيرة_هنا.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f5f5f7">

  <!-- هذا وحده يفيد بصمت — يبدأ الاتصال بخوادم جوجل من هسا بدل ما ينتظر
       لين يوصل سطر الـ iframe. ما إله أي شكل على الشاشة، بس يفيد فعلياً. -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <style>
    /* ملاحظة: ما حطيت أي شاشة تحميل هون بقصد — لوحة التحكم عندك أصلاً
       فيها شاشة تحميل كاملة ومصمّمة (globalLoader بالأدمن: شعار +
       شريط تقدّم + نسبة مئوية) تظهر فور ما يوصل الـ HTML. أي شاشة إضافية
       هون فوقها بس تكرّرها وتعطي إحساس "شاشتين ورا بعض" بالضبط زي ما
       لاحظت. خلّي الـ iframe يفتح على راحته وشاشة التحميل الحقيقية
       تسوي شغلها. */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0C2126; /* نفس خلفية شاشة تحميل الأدمن، حتى ما يبين
                                      ولا وميض أبيض قبل ما يوصل الـ iframe */
    }
    iframe {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe
    src="https://script.google.com/macros/s/AKfycbzzuX0XDJ-4MvF0vqmlo5jhUhPZd7U9fIbJJlPL0qMyIGcbgyRN9blOx6fY-nCVPiV4Iw/exec?page=admin"
    width="100%"
    height="100%"
    allowfullscreen="true">
  </iframe>

  <!-- ملاحظة: شلت استدعاء requestFullscreen() التلقائي — المتصفحات ما
       تسمح بالدخول للشاشة الكاملة تلقائياً بدون ضغطة مستخدم حقيقية،
       فكان يفشل بصمت بكل مرة. إذا تبي زر "ملء الشاشة" حقيقي يشتغل،
       قولّي أضيفه كزر يدوي. -->

</body>
</html>
