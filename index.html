<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Trending Rental | Premium Cars</title>

  <link rel="icon" type="image/png" href="TrendingPro.png">
  <link rel="apple-touch-icon" href="TrendingPro.png">

  <meta property="og:title" content="Trending Rental | Premium Cars">
  <meta property="og:description" content="احجز سيارتك الفاخرة الآن - نظام إدارة الحجوزات">
  <meta property="og:image" content="ضع_رابط_الصورة_الكبيرة_هنا.jpg"> <meta property="twitter:card" content="summary_large_image">
  
  <meta name="theme-color" content="#f5f5f7">

  <style>
    /* إزالة الحواف البيضاء ليكون الـ iframe ممتداً بالكامل */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f5f7;
    }
  </style>
</head>
<body>
  
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxGa5mL-B1J_Te22_wevOqUsGyl_UtUj0WMaL4YKKBgfcr80NKTnUuk3EjYzq6HK1jREA/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
